# Railway service config for the FastAPI backend.
# Set the service's "Root Directory" to `backend` in the Railway
# dashboard so Nixpacks runs against this directory.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
